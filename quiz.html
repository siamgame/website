<header>

<div class="container">
  <main>
    <h1>Test Your Knowledge</h1>

    <div id="user-progress">
      <h2>Your Progress</h2>
      <p>Points: <span id="points-display">0</span></p>
      <p>Badges: <span id="badges-display">None</span></p>
    </div>
    
    <div id="quiz-container">
      <p>What is 2 + 2?</p>
      <ul>
        <li><input type="radio" name="q1" value="3" id="q1a1"><label for="q1a1">3</label></li>
        <li><input type="radio" name="q1" value="4" id="q1a2"><label for="q1a2">4</label></li>
        <li><input type="radio" name="q1" value="5" id="q1a3"><label for="q1a3">5</label></li>
        <li><input type="radio" name="q1" value="6" id="q1a4"><label for="q1a4">6</label></li>
      </ul>
    </div>
    
    <button id="submit-quiz">Submit Quiz</button>
    <div id="quiz-results"></div>
    
  </main>
</div>

<footer>

</footer>
