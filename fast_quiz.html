<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fast-Paced Quiz - LearnHub</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <nav>
    <a href="index.html">Home</a>
    <a href="lessons.html">Lessons</a>
    <a href="games.html">Games</a>
    <a href="login.html">Login</a>
    <a href="register.html">Register</a>
  </nav>
</header>

<main class="container">
  <h1>Fast-Paced Quiz!</h1>
  
  <div id="game-status-area">
    <p>Time Left: <span id="time-left">10</span>s</p>
    <p>Score: <span id="current-score">0</span></p>
  </div>
  
  <div id="question-area">
    <p id="question-text">Question will appear here...</p>
  </div>
  
  <div id="answer-choices" class="answer-choices">
    <!-- Answer buttons will be populated by JavaScript -->
  </div>
  
  <p id="feedback-text"></p>
  
  <button id="start-quiz-btn">Start Game</button>
  
  <div id="final-results-area" style="display:none;">
    <h2>Game Over!</h2>
    <p>Your final score is: <span id="final-score">0</span></p>
    <button id="play-again-btn">Play Again</button>
  </div>
</main>

<footer>
  <p>© 2023 LearnHub</p>
</footer>

<script src="js/fast_quiz.js"></script>
</body>
</html>
